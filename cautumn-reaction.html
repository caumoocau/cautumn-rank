@font-face{font-family:'CookieRun';font-weight:601 900;font-style:normal;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/webfontworld/cookierun/CookieRunBold.woff2') format('woff2'),

<style>
:root{
  --ink:#3b2416; --ink2:#6b4a33; --paper:#fff8ee;
  --maple:#c0392b; --maple-d:#8e2a20; --amber:#e08a1e; --gold:#f2b544;
  --sky1:#ffd9a0; --sky2:#ffb877; --sky3:#f08b5a;
  --ok:#2e7d4f;
}
*{margin:0;padding:0;box-sizing:border-box}
*,*::before,*::after,input,button,select,textarea,table,th,td,h1,h2,h3,p,span,div,label{
  font-family:'CookieRun','Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif}
html,body{height:100%}
body{
  font-family:'CookieRun','Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  background:var(--sky1);
  color:var(--ink); overflow:hidden; user-select:none;
  display:flex; align-items:center; justify-content:center;
}
#stage{
  position:relative; width:100vw; height:100dvh; max-width:none; max-height:none;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 46%,var(--sky3) 100%);
  overflow:hidden;
}

/* 배경 장식 */
#bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.42);pointer-events:none}
.sun{position:absolute;top:8%;right:9%;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,#fff2c9 0%,#ffd479 46%,rgba(255,212,121,0) 72%);animation:glow 5s ease-in-out infinite}
@keyframes glow{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.07);opacity:1}}
.hill{position:absolute;left:-6%;right:-6%;border-radius:50% 50% 0 0}
.h1{bottom:0;height:23%;background:#8a4b23;opacity:.55}
.h2{bottom:0;height:16%;background:#6f3a1c;opacity:.6;left:-18%;right:24%}
.h3{bottom:0;height:12%;background:#5d2f16;opacity:.55;left:32%;right:-20%}
.ground{position:absolute;left:0;right:0;bottom:0;height:8%;background:linear-gradient(180deg,#7b4522,#5a3018)}
.fall{position:absolute;top:-90px;width:34px;opacity:.75;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translateY(-90px) rotate(0deg) translateX(0)}
  50%{transform:translateY(45vh) rotate(180deg) translateX(38px)}
  100%{transform:translateY(105vh) rotate(360deg) translateX(-24px)}
}

/* 공통 화면 */
.screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:26px;overflow-y:auto}
.screen.show{display:flex}
.screen>*{flex-shrink:0}
.card{width:100%;max-width:520px;background:rgba(255,248,238,.96);border:3px solid var(--maple);
  border-radius:20px;padding:26px 34px 30px;box-shadow:0 16px 40px rgba(60,25,10,.32)}
.hero{width:clamp(76px,11vh,124px);display:block;margin:0 auto 6px;
  filter:drop-shadow(0 8px 12px rgba(60,25,10,.22));animation:bobbing 2.4s ease-in-out infinite}
@keyframes bobbing{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@media(max-height:800px){
  .card{padding:18px 28px 22px}
  .hero{width:clamp(64px,9vh,96px);margin-bottom:2px}
  h1{font-size:31px}
  .lead{font-size:15px;margin-top:6px}
  .field{margin-top:12px}
  .btn{margin-top:14px;padding:14px;font-size:18px}
}
h1{font-size:38px;font-weight:800;color:var(--maple-d);line-height:1.3;letter-spacing:-.5px;-webkit-text-stroke:1.1px currentColor;paint-order:stroke fill}
.badge{display:inline-block;background:var(--maple);color:#fff8ee;font-size:14px;font-weight:700;
  border-radius:999px;padding:7px 18px;letter-spacing:.5px;margin-bottom:14px}
.lead{font-size:16px;color:var(--ink2);line-height:1.75;margin-top:10px}
.field{text-align:left;margin-top:18px}
.field label{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;padding:14px 16px;font-size:17px;font-family:inherit;color:var(--ink);
  border:2px solid #d8bfa4;border-radius:12px;background:#fff;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--maple)}
.consent{display:flex;align-items:flex-start;gap:9px;margin-top:16px;text-align:left;
  font-size:13px;color:var(--ink2);line-height:1.6;cursor:pointer}
.consent input{width:19px;height:19px;margin-top:1px;accent-color:var(--maple);cursor:pointer;flex-shrink:0}
.btn{margin-top:20px;width:100%;padding:17px;font-size:20px;font-weight:800;font-family:inherit;cursor:pointer;
  background:var(--maple);color:#fff8ee;border:none;border-radius:14px;box-shadow:0 6px 0 var(--maple-d);
  transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(6px);box-shadow:0 0 0 var(--maple-d)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--maple-d);border:2px solid var(--maple);box-shadow:none;font-size:16px;padding:12px;margin-top:10px}
.btn.ghost:active{transform:none}
.link{margin-top:14px;background:none;border:none;font-family:inherit;font-size:14px;
  color:var(--ink2);text-decoration:underline;cursor:pointer}
.err{margin-top:12px;font-size:14px;color:var(--maple);font-weight:700;min-height:20px}

/* 게임 화면 */
#s-play{cursor:pointer;padding:0}
#target-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#target{width:clamp(180px,26vw,300px);filter:drop-shadow(0 14px 24px rgba(60,25,10,.35));
  transition:transform .06s}
#target.pop{animation:pop .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.55) rotate(-14deg)}100%{transform:scale(1) rotate(0)}}
#msg{font-size:clamp(22px,3vw,32px);font-weight:800;color:var(--maple-d);text-shadow:0 2px 0 rgba(255,255,255,.6)}
#sub{font-size:16px;color:var(--ink2);font-weight:600}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s}

/* 결과 */
.result-time{font-size:64px;font-weight:800;color:var(--maple);line-height:1.1;margin:6px 0}
.result-time span{font-size:24px;color:var(--ink2)}
.grade{font-size:20px;font-weight:800;color:var(--amber);margin-bottom:4px}
.newbest{display:inline-block;background:var(--gold);color:#5b3a08;font-size:13px;font-weight:800;
  border-radius:999px;padding:5px 14px;margin-top:8px}

/* 랭킹 */
.board{width:100%;margin-top:16px;max-height:44vh;overflow-y:auto;border-radius:12px;background:#fff;border:2px solid #e6d3ba}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:11px 10px;text-align:left;border-bottom:1px solid #f0e3d2}
th{background:#f7ead9;color:var(--ink2);font-size:13px;font-weight:800;position:sticky;top:0}
td.t-rank{width:52px;font-weight:800;color:var(--amber)}
td.t-time{text-align:right;font-weight:800;color:var(--maple);white-space:nowrap}
td.t-when{text-align:right;color:#a08b74;font-size:12.5px;width:70px}
td.t-phone{color:var(--ink2);font-size:13.5px;letter-spacing:.3px}
tr.top3 td.t-rank{color:var(--maple)}
tr.me{background:#fff5e2}
.empty{padding:22px;text-align:center;color:#a08b74;font-size:15px}
.offline{padding:8px;text-align:center;font-size:13px;color:#b4552e;background:#ffeee4}
</style>
</head>

/* ═══ 배경: 떨어지는 낙엽 ═══ */
(function makeLeaves(){
  const bg=$('bg');
  for(let i=0;i<12;i++){
    const el=document.createElement('img');
    el.className='fall'; el.src=LEAF; el.alt='';
    el.style.left=(Math.random()*100)+'%';
    el.style.width=(20+Math.random()*30)+'px';
    el.style.opacity=(.35+Math.random()*.4).toFixed(2);
    el.style.animationDuration=(9+Math.random()*11).toFixed(1)+'s';
    el.style.animationDelay=(-Math.random()*16).toFixed(1)+'s';
    bg.appendChild(el);
  }
})();

/* ═══ 화면 전환 ═══ */
function show(id){ ['s-start','s-play','s-result','s-rank'].forEach(s=>$(s).classList.toggle('show',s===id)); }

/* ═══ 저장소 (Firebase REST) ═══ */
const LKEY='cautumn_react_local';
const localList=()=>{ try{ return JSON.parse(localStorage.getItem(LKEY))||[] }catch(e){ return [] } };
const localSave=l=>{ try{ localStorage.setItem(LKEY,JSON.stringify(l.slice(0,500))) }catch(e){} };
const norm=p=>String(p).replace(/[^0-9]/g,'');

async function fetchScores(){
  try{
    const r=await fetch(DB+'/scores.json',{cache:'no-store'});
    if(!r.ok) throw 0;
    const d=await r.json()||{};
    const list=Object.entries(d).map(([k,v])=>Object.assign({key:k},v));
    localSave(list);
    return {list,online:true};
  }catch(e){ return {list:localList(),online:false}; }
}
async function fetchPhones(){
  try{
    const r=await fetch(DB+'/contacts.json',{cache:'no-store'});
    if(!r.ok) return null;
    return await r.json()||{};
  }catch(e){ return null; }
}
/* 같은 이름+번호는 최고 기록만 남김 */
function best(list){
  const m=new Map();
  list.forEach(r=>{
    const k=r.name+'|'+norm(r.phoneTail||r.pid||'');
    const cur=m.get(k);
    if(!cur||r.ms<cur.ms) m.set(k,r);
  });
  return [...m.values()].sort((a,b)=>(a.ms-b.ms)||(a.at-b.at));
}

async function submit(ms){
  const now=new Date(), p=v=>String(v).padStart(2,'0');
  const digits=norm(me.phone);
  const rec={name:me.name, ms, pid:digits.slice(-4),
    time:p(now.getHours())+':'+p(now.getMinutes()), at:Date.now()};
  try{
    const r=await fetch(DB+'/scores.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});
    const j=await r.json(); myId=j&&j.name||null;
    if(myId) fetch(DB+'/contacts/'+myId+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:me.name,phone:me.phone,at:rec.at})}).catch(()=>{});
    return true;
  }catch(e){
    myId='local-'+rec.at; rec.key=myId; rec.phoneFull=me.phone;
    const l=localList(); l.push(rec); localSave(l);
    return false;
  }
}

async function renderBoard(){
  const box=$('board');
  box.innerHTML='<div class="empty">불러오는 중...</div>';
  const {list,online}=await fetchScores();
  const rows=best(list);
  if(!rows.length){ box.innerHTML='<div class="empty">아직 기록이 없어요.<br>첫 주자가 되어보세요! 🍁</div>'; return; }
  let phones=null;
  if(admin) phones=await fetchPhones();
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  const head='<tr><th>순위</th><th>이름</th>'+(admin?'<th>연락처</th>':'')+'<th style="text-align:right">기록</th><th style="text-align:right">시각</th></tr>';
  const body=rows.slice(0,30).map((r,i)=>{
    let ph='';
    if(admin){
      const full = phones&&phones[r.key]&&phones[r.key].phone;
      ph='<td class="t-phone">'+esc(full|| (r.phoneFull||('****-'+(r.pid||'????'))))+'</td>';
    }
    return '<tr class="'+(i<3?'top3':'')+(r.key&&r.key===myId?' me':'')+'">'
      +'<td class="t-rank">'+medal(i)+'</td>'
      +'<td>'+esc(r.name)+'</td>'+ph
      +'<td class="t-time">'+(r.ms/1000).toFixed(3)+'초</td>'
      +'<td class="t-when">'+esc(r.time||'')+'</td></tr>';
  }).join('');
  box.innerHTML=(online?'':'<div class="offline">오프라인 · 이 노트북 기록만 표시됩니다</div>')
    +'<table>'+head+body+'</table>';
}

/* ═══ 게임 ═══ */
function startRound(){
  show('s-play');
  phase='wait';
  $('target').src=LEAF;
  $('target').classList.remove('pop');
  $('msg').textContent='준비...';
  $('sub').textContent='푸앙이가 나타나면 클릭!';
  const wait=MIN_WAIT+Math.random()*(MAX_WAIT-MIN_WAIT);
  clearTimeout(timer);
  timer=setTimeout(()=>{
    phase='go';
    swapAt=performance.now();
    const t=$('target');
    t.src=PUANG;
    void t.offsetWidth; t.classList.add('pop');
    $('msg').textContent='지금!';
    $('sub').textContent='';
    const f=$('flash'); f.style.opacity='.55'; setTimeout(()=>f.style.opacity='0',60);
  },wait);
}
function click(){
  if(phase==='wait'){
    clearTimeout(timer); phase='idle';
    $('msg').textContent='너무 빨라요! 🍂';
    $('sub').textContent='잠시 후 다시 시작합니다';
    setTimeout(startRound,1300);
    return;
  }
  if(phase!=='go') return;
  phase='done';
  const ms=Math.round(performance.now()-swapAt);
  myMs=ms;
  finish(ms);
}
$('s-play').addEventListener('pointerdown',e=>{ e.preventDefault(); click(); });
document.addEventListener('keydown',e=>{
  if($('s-play').classList.contains('show')){
    if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); click(); }
    return;
  }
  if($('s-start').classList.contains('show') && e.code==='Enter') start();
});

function grade(ms){
  if(ms<180) return ['⚡ 신의 반사신경','인간의 영역을 넘어섰습니다!'];
  if(ms<250) return ['🍁 단풍 사냥꾼','프로게이머급 반응속도!'];
  if(ms<320) return ['🌰 다람쥐급','평균보다 훨씬 빠릅니다'];
  if(ms<420) return ['🍂 가을 산책자','딱 좋은 반응속도예요'];
  return ['☕ 여유로운 가을','천천히 가도 괜찮아요'];
}
async function finish(ms){
  const [g,desc]=grade(ms);
  $('res-grade').textContent=g;
  $('res-time').innerHTML=(ms/1000).toFixed(3)+'<span>초</span>';
  $('res-desc').textContent=desc;
  $('res-best').innerHTML='';
  show('s-result');
  const {list}=await fetchScores();
  const prev=best(list).find(r=>r.name===me.name&&r.pid===norm(me.phone).slice(-4));
  await submit(ms);
  if(prev && ms<prev.ms) $('res-best').innerHTML='<span class="newbest">🎉 개인 최고기록 경신! (이전 '+(prev.ms/1000).toFixed(3)+'초)</span>';
  else if(prev) $('res-best').innerHTML='<span class="newbest" style="background:#e6d3ba;color:#6b4a33">이전 최고기록 '+(prev.ms/1000).toFixed(3)+'초 유지</span>';
}

/* ═══ 입력 ═══ */
$('in-phone').addEventListener('input',e=>{
  let v=norm(e.target.value).slice(0,11);
  if(v.length>7) v=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7);
  else if(v.length>3) v=v.slice(0,3)+'-'+v.slice(3);
  e.target.value=v;
});
function start(){
  const n=$('in-name').value.trim(), p=$('in-phone').value.trim();
  const d=norm(p);
  if(n.length<1){ $('err').textContent='이름을 입력해 주세요'; return; }
  if(d.length<10){ $('err').textContent='연락처를 정확히 입력해 주세요'; return; }
  if(!$('in-agree').checked){ $('err').textContent='개인정보 수집에 동의해 주세요'; return; }
  $('err').textContent='';
  me={name:n.slice(0,10),phone:p}; myId=null;
  startRound();
}
$('btn-start').addEventListener('click',start);
$('btn-again').addEventListener('click',()=>{
  $('in-name').value=''; $('in-phone').value=''; $('in-agree').checked=false;
  $('err').textContent=''; admin=false; show('s-start'); $('in-name').focus();
});
let prevScreen='s-start';
function openRank(from){ prevScreen=from; show('s-rank'); renderBoard(); }
$('btn-rank1').addEventListener('click',()=>openRank('s-start'));
$('btn-rank2').addEventListener('click',()=>openRank('s-result'));
$('btn-close').addEventListener('click',()=>{ admin=false; show(prevScreen); });
$('btn-admin').addEventListener('click',async()=>{
  if(admin){ admin=false; renderBoard(); return; }
  const pw=prompt('운영진 비밀번호를 입력하세요');
  if(pw===null) return;
  if(pw!==ADMIN_PW){ alert('비밀번호가 올바르지 않습니다.'); return; }
  admin=true;
  await renderBoard();
  alert('운영진 모드: 연락처가 표시됩니다.\n한 번 더 누르면 숨겨집니다.\n\n※ 연락처가 "****-1234"로만 보이면 Firebase 규칙에서 contacts 읽기가 차단된 상태입니다.\n   전체 번호는 Firebase 콘솔에서 확인하세요.');
});
$('in-name').focus();
</script>
